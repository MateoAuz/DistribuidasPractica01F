<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app_01">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>app_01</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Prueba de estrés / teclas al azar:
    // Bloquea atajos nativos del navegador que abren diálogos o cambian de
    // vista (F7 = navegación por cursor, F11 = pantalla completa,
    // F1 = ayuda, F3/Ctrl+F = buscar, Escape, etc.) para que la app
    // permanezca estática ante teclas presionadas al azar.
    // Se deja pasar SOLO la tecla de recargar (F5 o Ctrl+R).
    (function () {
      var blocked = new Set([
        'F1', 'F2', 'F3', 'F4', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12',
        'Escape'
      ]);

      window.addEventListener('keydown', function (event) {
        var isReload = event.key === 'F5' ||
          ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'r');

        if (isReload) {
          return; // se permite recargar la página normalmente
        }

        if (blocked.has(event.key)) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
